name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Full-monorepo turbo typecheck OOMs (exit 137) on github-hosted runners
      # when many packages compile in parallel. Cap concurrency for this fork.
      - name: Run typecheck
        run: bun typecheck
        env:
          TURBO_CONCURRENCY: "2"
          NODE_OPTIONS: "--max-old-space-size=4096"
