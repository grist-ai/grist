name: publish-grist

# Releases are manual ONLY (workflow_dispatch) — deliberately not triggered by
# tags or pushes. Publishing the Grist CLI ships a billing-adjacent artifact
# (metered spend caps, panic button), so every release is a human decision
# with an explicit version + dist-tag. Guardrails below: pre-publish gitleaks
# secret scan of the working tree, and --provenance attestations on publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0). Must match the release intent — no auto-bump."
        required: true
        type: string
      channel:
        description: "npm dist-tag"
        required: false
        type: choice
        default: latest
        options:
          - latest
          - beta
          - next
      single:
        description: "Build current platform only (faster smoke publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use npm with OIDC trusted publishing
        run: npm install -g npm@11.15.0

      # Pre-publish secret gate: fail the release if gitleaks finds anything
      # outside .gitleaks.toml's reviewed allowlist. Runs before `bun install`
      # so node_modules never enters the scan. Version pinned to match the
      # config's baseline (8.28.0, verified 2026-09-22).
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --config .gitleaks.toml --verbose

      # Full-platform install: the --all-targets build embeds the pty native
      # binary for EVERY target, so all @opencode-ai/pty-<platform> packages
      # must be present (slow: ~6 min, cached by actions/setup-bun).
      - name: Install
        run: bun install --os="*" --cpu="*" --ignore-scripts

      - name: Fix node-pty
        run: bun run --cwd packages/core fix-node-pty

      - name: Build
        run: |
          if [ "${{ inputs.single }}" = "true" ]; then
            bun run --cwd packages/grist build
          else
            bun run --cwd packages/grist build:all
          fi
        env:
          GRIST_VERSION: ${{ inputs.version }}
          GRIST_CHANNEL: ${{ inputs.channel }}

      # Do not set NODE_AUTH_TOKEN or setup-node registry-url. An empty
      # _authToken line stops npm from doing the OIDC exchange. script/publish.ts
      # spawns npm with the full step environment so ACTIONS_ID_TOKEN_* reaches it.
      - name: Stage and publish to npm
        run: bun run --cwd packages/grist publish
        env:
          GRIST_VERSION: ${{ inputs.version }}
          GRIST_CHANNEL: ${{ inputs.channel }}
