name: publish-grist

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0). Leave empty to auto-bump patch from npm."
        required: false
        type: string
      channel:
        description: "npm dist-tag"
        required: false
        type: choice
        default: latest
        options:
          - latest
          - beta
          - next
      single:
        description: "Build current platform only (faster smoke publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Use npm with OIDC trusted publishing
        run: npm install -g npm@11.15.0

      - name: Install
        run: bun install --ignore-scripts

      - name: Fix node-pty
        run: bun run --cwd packages/core fix-node-pty

      - name: Build
        run: |
          flags=""
          if [ "${{ inputs.single }}" = "true" ]; then
            flags="--single --skip-embed-web-ui"
          fi
          bun run --cwd packages/opencode script/build.ts $flags
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: ${{ inputs.channel }}

      # Do not set NODE_AUTH_TOKEN or setup-node registry-url. An empty
      # _authToken line stops npm from doing the OIDC exchange. Publish from
      # this bash step (not bun $) so ACTIONS_ID_TOKEN_* reaches npm.
      - name: Prepare npm packages
        run: bun run --cwd packages/opencode script/publish.ts
        env:
          GRIST_PREPARE_ONLY: "1"
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: ${{ inputs.channel }}

      - name: Publish to npm
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          publish_one() {
            local dir="$1"
            local name version
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version}"
              return 0
            fi
            echo "publish ${name}@${version}"
            (cd "$dir" && npm publish --access public --tag "${OPENCODE_CHANNEL:-latest}")
          }
          for dir in dist/grist-*; do
            [ -d "$dir" ] || continue
            [ "$(basename "$dir")" = "grist-ai" ] && continue
            if ! publish_one "$dir"; then
              case "$dir" in
                *windows*|*musl*|*baseline*) echo "warn: ${dir} publish failed, continuing" ;;
                *) exit 1 ;;
              esac
            fi
          done
          publish_one dist/grist-ai
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel }}
