name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Grist fork CI: do not run the full upstream OpenCode turbo/e2e matrix.
# Those jobs need Blacksmith-class runners and fail en masse on github-hosted
# (timeouts, Windows patch installs, flaky Playwright). Scope to Grist packages.
jobs:
  grist:
    name: grist
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --ignore-scripts

      - name: Fix node-pty
        run: bun run --cwd packages/core fix-node-pty

      - name: Grist unit tests
        timeout-minutes: 10
        run: bun run --cwd packages/opencode test src/grist/

      - name: Opencode typecheck
        timeout-minutes: 10
        run: bun run --cwd packages/opencode typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
